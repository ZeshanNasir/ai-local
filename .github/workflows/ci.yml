name: CI

on:
  push:
    branches: [ main ]
  pull_request:

# The tests use no model and no network: scorers, statistics, cost arithmetic and the runner
# logic against a fake client. Measurements themselves need a local Ollama and are run by hand.
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: [ "3.10", "3.13" ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests
      - run: python -m labbench cost examples/assumptions.example.json
